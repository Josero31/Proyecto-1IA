<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AGIChat — integración en HTML plano</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 48px auto;
        padding: 0 24px;
      }

      /* Tema opcional: el widget toma estos valores a través del Shadow DOM. */
      agichat-widget {
        --agichat-primary: #0a4d8c;
        --agichat-primary-hover: #083d70;
      }
    </style>
  </head>
  <body>
    <h1>Tienda de ejemplo</h1>
    <p>El chat aparece en la esquina inferior izquierda con la paleta azul de esta tienda.</p>

    <!--
      1. Cargar el SDK. En producción, usar la URL del CDN o del paquete publicado:
         <script type="module" src="https://cdn.jsdelivr.net/npm/@agichat/widget-sdk"></script>
      2. Colocar la etiqueta. Eso es todo: usa el transporte mock por defecto.
    -->
    <script type="module" src="../../dist/agichat-widget-sdk.js"></script>

    <agichat-widget
      agent-name="Asistente de cine"
      welcome-message="¡Hola! Soy el asistente de cine de AGIChat. Puedo recomendarte películas según tus gustos, mostrarte su póster y abrir su ficha en IMDb. Además, si una película está basada en un libro, puedo compararla con el libro y decirte si vale la pena verla. ¿Qué se te antoja ver hoy?"
      position="bottom-left"
    ></agichat-widget>

    <script type="module">
      const widget = document.querySelector('agichat-widget');

      widget.addEventListener('agichat-open', () => console.log('El usuario abrió el chat'));
      widget.addEventListener('agichat-close', () => console.log('El usuario cerró el chat'));

      // Con ?ws=ws://localhost:8000/ws en la URL se usa el gateway real; si no, el mock.
      const wsUrl = new URLSearchParams(location.search).get('ws');
      if (wsUrl) {
        import('../../dist/agichat-widget-sdk.js').then(({ WebSocketAgentTransport }) => {
          widget.transport = new WebSocketAgentTransport(wsUrl);
        });
      }
    </script>
  </body>
</html>
