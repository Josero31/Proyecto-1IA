[project]
name = "agichat-backend"
version = "0.1.0"
description = "Sistema multiagente de AGIChat: recomendación de películas (TMDB), comparación con libros (Google Books) y MCP servers"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp>=2.3,<3",
  "openai>=3.0,<4",
  "httpx>=0.28,<1",
  "redis>=6.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "uvicorn>=0.30",
  "fastapi>=0.115",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.0",
  "pytest-cov>=6.0",
  "ruff>=0.15",
  "fakeredis>=2.30",
]

[project.scripts]
agichat-tmdb-mcp = "agichat.mcp_servers.tmdb.__main__:main"
agichat-books-mcp = "agichat.mcp_servers.books.__main__:main"
agichat-references-mcp = "agichat.mcp_servers.references.__main__:main"
agichat-gateway = "agichat.gateway.__main__:main"
agichat-chat = "agichat.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agichat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["agichat"]
branch = true
# Puntos de entrada de procesos (arrancan uvicorn o leen stdin); igual que src/index.ts en el SDK.
omit = ["*/__main__.py", "*/agichat/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
