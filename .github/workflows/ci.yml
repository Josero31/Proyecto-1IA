name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests con cobertura (mínimo 80%)
        run: pnpm test:coverage

      - name: Build del SDK
        run: pnpm build

      - name: Presupuesto de tamaño del bundle
        run: pnpm size

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
