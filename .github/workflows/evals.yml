name: Evals

# Solo manual: los evals corren el sistema real y gastan cuota de Groq y TMDB.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Veces que se corre cada caso (cuenta como aprobado solo si pasa todas)
        default: '2'

jobs:
  evals:
    name: Evals funcionales y OWASP LLM01 / LLM07
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Correr evals
        working-directory: backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          REPEATS: ${{ inputs.repeats }}
        run: python -m evals.run --repeats "$REPEATS"

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-evals
          path: backend/evals/reports/
          retention-days: 30
